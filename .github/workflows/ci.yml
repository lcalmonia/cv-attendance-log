name: CV Log CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "fix-*"
      - "performance-*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build
